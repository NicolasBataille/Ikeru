name: Deploy Edge Function

# Closes the deployment half of GAP-07.
#
# `supabase/functions/delete-account` is what makes account deletion real, and
# `docs/privacy.html` — served publicly from GitHub Pages the moment master
# moves — PROMISES that deletion. Until now the function was only ever pushed
# by hand, from a laptop, by someone who remembered to. The failure mode is
# quiet and asymmetric: if the project is reset or the function is edited and
# not redeployed, the button returns 404 while the published privacy policy
# keeps making the promise.
#
# ⚠️ THIS JOB DOES NOTHING UNTIL A SECRET EXISTS.
#
# It needs `SUPABASE_ACCESS_TOKEN` (Supabase dashboard → Account → Access
# Tokens), added under Settings → Secrets and variables → Actions. That is a
# human step and cannot be automated from here — it is a credential.
#
# With the secret absent the job emits a GitHub *warning* and exits 0, rather
# than failing. A permanently red build on every master push teaches people to
# ignore red builds, and this workflow is not what should gate a release. The
# warning is visible in the Actions tab and in the run summary.

on:
  push:
    branches: [master]
    # Only when the function or its config actually changed. Deploying an
    # unchanged function on every master push would burn minutes and make the
    # deployment history useless for answering "when did this last change?".
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-deploy-function.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy-function
  cancel-in-progress: false

env:
  PROJECT_REF: aiayzlarixlogcoyswna

jobs:
  deploy:
    name: Deploy delete-account
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for the access token
        id: guard
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning title=Edge function not deployed::\
          SUPABASE_ACCESS_TOKEN is not set, so supabase/functions/delete-account \
          was NOT redeployed. docs/privacy.html promises server-side deletion. \
          Add the secret (Supabase dashboard -> Account -> Access Tokens) or \
          deploy by hand: supabase functions deploy delete-account --project-ref ${PROJECT_REF}"
            echo "have_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the Supabase CLI
        if: steps.guard.outputs.have_token == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        if: steps.guard.outputs.have_token == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # config.toml pins `verify_jwt = true`, so this reproduces the reviewed
        # configuration rather than whatever was last clicked in a dashboard.
        run: supabase functions deploy delete-account --project-ref "$PROJECT_REF"

      - name: Verify the deployed function rejects unauthenticated callers
        if: steps.guard.outputs.have_token == 'true'
        # A deploy that reports success and leaves an endpoint that answers
        # anonymously is worse than no deploy. This is the smallest check that
        # would have caught `verify_jwt = false`, and it needs no credentials:
        # the gateway must reject a request carrying no bearer token.
        #
        # It asserts the gate, NOT the deletion logic — proving deletion works
        # would mean creating a real user and destroying their data, which is
        # not something a CI job should do against production.
        run: |
          URL="https://${PROJECT_REF}.supabase.co/functions/v1/delete-account"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL")
          echo "unauthenticated POST -> HTTP $CODE"
          if [ "$CODE" != "401" ]; then
            echo "::error title=Edge function is not gated::Expected 401 without a bearer token, got ${CODE}. The function may be deployed with verify_jwt disabled."
            exit 1
          fi
          echo "Gate holds: unauthenticated callers get 401."
