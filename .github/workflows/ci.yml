name: CI

on:
  push:
    # `dev` runs the same lint/build/test/device-build matrix as master,
    # but the deploy-testflight job is gated on `master` so dev pushes
    # never upload to TestFlight. Two-stage flow:
    #   feature → PR → dev (CI validates, no deploy)
    #   dev → master (CI + TestFlight deploy)
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  # Manual re-run — lets us re-trigger a TestFlight deploy (e.g. after a
  # transient Apple-side upload failure) without pushing an empty commit
  # to master. Run it from the Actions tab on the `master` ref with
  # `deploy_testflight: true`; with the input left false it just re-runs
  # lint/build/test/device-build.
  workflow_dispatch:
    inputs:
      deploy_testflight:
        description: "Also run the TestFlight deploy job"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the changed-files step below can diff against
          # origin/<base-ref> — the default shallow (depth-1) clone only
          # has HEAD and can't compute that merge-base.
          fetch-depth: 0

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint (whole repo, non-strict)
        # `--strict` promotes warnings to errors — the legacy codebase has
        # ~200 stylistic warnings (identifier_name on short var names,
        # comma spacing, etc.). The gate stays informational for now: the
        # warnings show up in the GitHub UI but don't block. Errors (force
        # unwraps, hard violations) still fail the job.
        run: swiftlint lint --reporter github-actions-logging

      - name: SwiftLint --strict on changed lines (PRs only)
        # Holds *new* code to the strict standard (warnings fail the job)
        # without blocking on the legacy backlog above. Diff-HUNK aware:
        # a violation only fails the job if it sits on a line this PR
        # touched (whole-file linting false-blocked PR #54 on pre-existing
        # size violations in a lightly-touched 1500-line legacy file).
        # File-level rules (file_length/type_body_length) only count for
        # files ADDED by the PR — see scripts/swiftlint-diff-filter.py.
        # Only meaningful on a pull_request event; no-ops on push.
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --force
          CHANGED_SWIFT_FILES=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.swift')
          if [ -z "$CHANGED_SWIFT_FILES" ]; then
            echo "No changed Swift files — skipping strict lint."
            exit 0
          fi
          echo "Changed Swift files:"
          echo "$CHANGED_SWIFT_FILES"
          echo "$CHANGED_SWIFT_FILES" | xargs swiftlint lint --reporter json --quiet \
            | python3 scripts/swiftlint-diff-filter.py "origin/${{ github.base_ref }}"

  i18n-lint:
    name: i18n Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run i18n lint
        # Reconstructs the LocalizedStringKey SwiftUI generates for every
        # Text(...) call site in the app target and checks it against
        # Localizable.xcstrings (missing key, missing FR, or a %lld/%@
        # specifier mismatch — see scripts/i18n-lint.py). Only fails on
        # violations not already captured in the baseline, so today's
        # backlog stays green and only *new* leaks block CI.
        run: python3 scripts/i18n-lint.py --baseline scripts/i18n-lint-baseline.json

  build:
    name: Build (${{ matrix.scheme }})
    runs-on: macos-15
    needs: lint
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        scheme: [Ikeru, IkeruWatch, IkeruWidget]
        include:
          - scheme: Ikeru
            destination: "generic/platform=iOS Simulator"
          - scheme: IkeruWatch
            destination: "generic/platform=watchOS Simulator"
          - scheme: IkeruWidget
            destination: "generic/platform=iOS Simulator"

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Ikeru.xcodeproj \
            -scheme ${{ matrix.scheme }}

      - name: Build ${{ matrix.scheme }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project Ikeru.xcodeproj \
            -scheme ${{ matrix.scheme }} \
            -destination "${{ matrix.destination }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "build-${{ matrix.scheme }}.log"

      - name: Surface compiler errors on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync(`build-${{ matrix.scheme }}.log`, 'utf8'); } catch (e) { return; }
            const errs = [...new Set(
              log.split('\n').filter(l => /(error:|fatal error:|: error)/.test(l))
            )].slice(0, 40);
            if (errs.length === 0) return;
            const body = [
              `**Build (${{ matrix.scheme }}) failed — compiler errors:**`,
              '',
              '```',
              errs.join('\n'),
              '```'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  test:
    name: Test
    runs-on: macos-15
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Run IkeruCore Tests (everything but the migration suites)
        # This step used to be a `--filter` ALLOWLIST of ~50 suite names, and
        # the comment here justified it with three claims that were all wrong.
        # Recorded so nobody re-derives them (2026-08-15, GAP-10):
        #
        #   "SIGSEGVs mid-run"        -> `swift test` exited 1, never 139.
        #   "a legacy suite"          -> LocalGPUProviderTests, written by us.
        #   "runs clean locally"      -> it did not; 48 issues locally too.
        #
        # The real cause was one default argument: `LocalGPUProvider()` with no
        # arguments defaults `bonjourDiscovery` to `NWBonjourDiscovery()`, which
        # stands up a live `NWBrowser`. Two tests asserting hardcoded strings
        # took the whole process down on a runner with no Bonjour. Filed as an
        # external constraint, it became nobody's job for months.
        #
        # It was never unbisectable — only unbisectable LOCALLY, which is a
        # different claim. A one-off probe job on CI named it on its first run.
        #
        # Cost while it stood: 587 of 1253 Core tests (47%) never executed here.
        #
        # Now a DENYLIST, and that inversion is the point. An allowlist fails
        # open in the wrong direction: every newly-written suite is excluded by
        # default, silently, until someone remembers to add its name. A denylist
        # runs new suites automatically and forces anything excluded to be named
        # and justified right here.
        #
        # `--no-parallel` + a SEPARATE step for LegacyStoreMigration (below):
        # opening a container with the frozen V1 shapes (IkeruSchema.swift)
        # poisons CoreData's process-global entity↔class cache for the
        # "RPGState" entity — after that, V2 fetches in the SAME process can
        # materialize the wrong class and crash ("Failed to cast model ...").
        # Serializing isn't enough (the poisoning persists after the suite
        # finishes), so the migration suite runs in its own `swift test`
        # process in the next step, and is deliberately named so this step's
        # "IkeruSchema" token does not match it. `--no-parallel` here still
        # guards the residual concurrent-model-loading race. Test-harness-only:
        # production builds exactly one container.
        # The three excluded suites are NOT excluded for the Bonjour reason —
        # they are the store-migration round-trips, which must each own their
        # process (see the next steps). They are skipped here and run there.
        #
        # Deliberately NOT folded back in just because a probe run happened to
        # survive them: CLAUDE.md documents the CoreData poisoning as something
        # a later fetch *can* hit, not *will*. One green run is evidence it did
        # not fire, not that it cannot. Local: 1250 tests / 174 suites green.
        run: |
          cd IkeruCore
          swift test --no-parallel \
            --skip "LegacyStoreMigration" \
            --skip "StoreMigrationV2V3" \
            --skip "StoreMigrationV3V4"

      - name: Run Legacy-Store Migration Tests (own process)
        # See the previous step's comment: this suite must never share a
        # process with other SwiftData suites. It is the regression guard for
        # the release-blocking a7371a3-store migration bug.
        run: |
          cd IkeruCore
          swift test --no-parallel --filter "LegacyStoreMigration"

      - name: Run V2→V3 Store Migration Tests (own process)
        # Same containment rule as the previous step, and for the same
        # reason: opening a versioned-schema container against frozen nested
        # types then reopening that store with live top-level types poisons
        # SwiftData's process-global entity↔class cache, so this suite must
        # never share a `swift test` process with any other SwiftData suite
        # — see StoreMigrationV2V3Tests.swift's header comment. It also must
        # not share a process with the Legacy-Store Migration step above:
        # each store-opening migration suite gets its own process.
        run: |
          cd IkeruCore
          swift test --no-parallel --filter "StoreMigrationV2V3"

      - name: Run Store Migration V3→V4 Tests (isolated process)
        # Same isolation reason as the two steps above: every store-opening
        # migration suite gets its own `swift test` process. This one covers
        # the sync columns (updatedAt / deletedAt / syncedAt) landing on
        # existing rows — the migration real TestFlight devices will run.
        run: |
          cd IkeruCore
          swift test --no-parallel --filter "StoreMigrationV3V4"

      - name: Run App Tests (green subset)
        # Same — scoped to suites known to pass. KanaDrillViewModel covers
        # the recent shuffle-fix regression tests.
        #
        # Picks whichever iPhone simulator the runner has installed —
        # macos-15 image bumps Xcode/simulators periodically, so
        # hardcoding `name=iPhone 16` breaks the moment Apple drops it.
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          best = None
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime: continue
              for d in devices:
                  if d['name'].startswith('iPhone') and d.get('isAvailable', True):
                      key = (runtime, d['name'])
                      if best is None or key > best[0]:
                          best = (key, d['udid'])
          print(best[1] if best else '', end='')
          ")
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No iPhone simulator available on runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $DEVICE_ID"
          # The WHOLE app test target, not an allowlist (GAP-10, 2026-08-16).
          #
          # This used to name 17 suites explicitly, because the target's other
          # suites crashed the test runner. Both crashes are now fixed at the
          # cause (a seed helper displacing a saved RPGState through the
          # relationship's owning side; a ModelContainer dropped while its
          # ModelContext was still in use), so the filter has nothing left to
          # protect. Measured locally on iPhone 17 after the fixes:
          # 372 tests, 41 suites, 0 runner restarts, ~54s.
          #
          # An allowlist fails OPEN, which is why this is not simply a longer
          # list: a suite added tomorrow is silently not run, exactly as the
          # 228 tests this list excluded were silently not run. Core made the
          # same move to a denylist for the same reason (see CLAUDE.md). If a
          # suite ever has to be excluded, exclude it with `-skip-testing:`
          # and say why right here — so the exclusion is visible and every
          # NEW suite runs by default.
          #
          # No `CODE_SIGNING_ALLOWED=NO`: an unsigned simulator build has no
          # sandbox and no Keychain (`-34018`), which `KeychainAvailabilityTests`
          # proves — and that suite is now in scope. Ad-hoc "Sign to Run
          # Locally" signing needs no credentials, so dropping the flag costs
          # nothing.
          xcodebuild test \
            -project Ikeru.xcodeproj \
            -scheme Ikeru \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -skipPackagePluginValidation \
            -only-testing:IkeruTests

  ui-test:
    name: UI Test (IkeruUITests)
    runs-on: macos-15
    needs: lint
    # Non-blocking for now (GAP-09): this is the FIRST UI-test target this
    # repo has ever had, run on a brand-new runner combination (XCUITest +
    # GitHub's macos-15 image) that has had zero baking time. The app
    # target's two SwiftData crashes, which this comment used to list as an
    # additional risk to this job, are fixed at the cause (GAP-10,
    # 2026-08-16) and no longer apply. Kept as its own job (not a step in
    # `test`) so promoting it to blocking later, or removing it, is a
    # self-contained change. `continue-on-error` so a flake here
    # (CI-runner UI automation is known-flakier than unit tests) never reds
    # out the required checks — promote once a week or two of green runs
    # establishes it isn't systematically flaky on this runner image.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Run IkeruUITests
        # Same dynamic-simulator pick as the `test` job (see its comment) —
        # never hardcode `name=iPhone 16`, the runner's available devices
        # bump with the macos-15 image periodically.
        #
        # No CODE_SIGNING_ALLOWED=NO here, unlike `device-build-check` and
        # part of `test`: a UI test drives the real app process, which needs
        # its sandbox and Keychain to behave like production — see
        # CLAUDE.md's "N'utilise JAMAIS CODE_SIGNING_ALLOWED=NO pour lancer
        # des tests" and IkeruTests/KeychainAvailabilityTests.swift, which
        # measured exactly this failure mode. Simulator destinations don't
        # need a real Apple Developer certificate either way — Xcode ad-hoc
        # signs simulator builds automatically ("Sign to Run Locally"),
        # confirmed locally: `xcodebuild build-for-testing -scheme
        # IkeruUITests` signs with that identity with no certificate
        # imported.
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          best = None
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime: continue
              for d in devices:
                  if d['name'].startswith('iPhone') and d.get('isAvailable', True):
                      key = (runtime, d['name'])
                      if best is None or key > best[0]:
                          best = (key, d['udid'])
          print(best[1] if best else '', end='')
          ")
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No iPhone simulator available on runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $DEVICE_ID"
          xcodebuild test \
            -project Ikeru.xcodeproj \
            -scheme IkeruUITests \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -skipPackagePluginValidation \
            -resultBundlePath TestResults/IkeruUITests.xcresult

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IkeruUITests-xcresult
          path: TestResults/IkeruUITests.xcresult
          retention-days: 14

  device-build-check:
    name: Device Build (no signing)
    runs-on: macos-15
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Build for arm64 device
        run: |
          xcodebuild build \
            -project Ikeru.xcodeproj \
            -scheme Ikeru \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  deploy-testflight:
    name: Deploy to TestFlight
    runs-on: macos-15
    needs: [lint, build, test, device-build-check, i18n-lint]
    # Deploys on every push to master, or on a manual workflow_dispatch run
    # with the `deploy_testflight` input checked (re-trigger a deploy
    # without an empty commit). Dispatch deploys are pinned to master so a
    # dev-ref dispatch can never ship a non-release build to TestFlight.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && inputs.deploy_testflight == true && github.ref == 'refs/heads/master')
    environment:
      name: testflight
      url: https://appstoreconnect.apple.com/apps
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Import iOS Distribution Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}

      # No provisioning-profile download step: xcodebuild's
      # -allowProvisioningUpdates + -authenticationKey* flags (below)
      # auto-create the App Store profile via the ASC API key. Saves
      # us from pre-registering a profile in the dev portal.

      - name: Bump build number
        id: bump
        run: |
          # CFBundleVersion — unique per upload; Apple only requires it to grow.
          BUILD_NUM=$(date -u +"%Y%m%d%H%M")

          # CFBundleShortVersionString — this is what TestFlight shows next to
          # the build. It used to be the hardcoded MARKETING_VERSION (1.0.0),
          # so every single build read "1.0.0" and testers could not tell one
          # release from another. MAJOR.MINOR stay hand-owned in the project
          # (bump them for a real release); PATCH is the commit count on this
          # branch, which is monotonic and needs no state, so each deploy ships
          # a distinct, honest version. `fetch-depth: 0` above is what makes
          # the count real — a shallow clone would always report 1.
          BASE=$(sed -n 's/.*MARKETING_VERSION = \([0-9]*\.[0-9]*\).*/\1/p' Ikeru.xcodeproj/project.pbxproj | head -1)
          PATCH=$(git rev-list --count HEAD)
          VERSION="${BASE}.${PATCH}"

          echo "build_number=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "marketing_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Shipping version ${VERSION} (build ${BUILD_NUM})"

      - name: Decode ASC API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_API_KEY_BASE64 }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8

      - name: Archive
        run: |
          xcodebuild archive \
            -project Ikeru.xcodeproj \
            -scheme Ikeru \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Ikeru.xcarchive \
            -skipPackagePluginValidation \
            CURRENT_PROJECT_VERSION=${{ steps.bump.outputs.build_number }} \
            MARKETING_VERSION=${{ steps.bump.outputs.marketing_version }} \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            -allowProvisioningUpdates \
            -authenticationKeyID ${{ secrets.ASC_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8

      - name: Generate ExportOptions.plist
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Ikeru.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID ${{ secrets.ASC_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8

      - name: Upload to TestFlight
        # Using `xcrun altool` directly instead of
        # apple-actions/upload-testflight-build@v3 — that action expects
        # the ASC API key as raw PEM, but we store it as base64 (for the
        # Decode ASC API Key step above). altool with --apiKey looks the
        # key up in ~/.appstoreconnect/private_keys/AuthKey_<id>.p8, which
        # the Decode step has already populated.
        #
        # altool has a quirk where validation failures (invalid bundle,
        # missing orientations, etc.) print "UPLOAD FAILED" but still
        # exit 0, so we grep its output for failure markers and force a
        # non-zero exit ourselves.
        run: |
          set -o pipefail
          xcrun altool --upload-app \
            --file build/ipa/Ikeru.ipa \
            --type ios \
            --apiKey "${{ secrets.ASC_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" 2>&1 | tee altool.log
          if grep -qE "UPLOAD FAILED|Failed to upload|ERROR ITMS-" altool.log; then
            echo "::error::altool reported upload failure — check logs above"
            exit 1
          fi

      - name: Upload archive as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ikeru-${{ steps.bump.outputs.build_number }}.xcarchive
          path: build/Ikeru.xcarchive
          retention-days: 14
